name: Prepare v5.1.0 package version

on:
  push:
    branches: [release/v5.1.0]

permissions:
  contents: write

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[v5.1-versioned]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v5.1.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set package version
        run: npm version 5.1.0 --no-git-tag-version
      - name: Validate
        run: npm ci --ignore-scripts --legacy-peer-deps && npm run check
      - name: Commit package version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[v5.1-versioned] Set package version to 5.1.0"
          git push
