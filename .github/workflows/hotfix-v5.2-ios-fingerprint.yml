name: Hotfix v5.2 iOS fingerprint hang

on:
  push:
    branches: [hotfix/v5.2-ios-fingerprint-hang]

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2-ios-fingerprint-hang
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted no-reread fingerprint hotfix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'src/main.ts';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(from, to) {
            if (!source.includes(from)) throw new Error(`Expected source pattern not found: ${from.slice(0, 100)}`);
            source = source.replace(from, to);
          }

          replaceOnce(
            `import { selectLatestTradeRepublicSourcesByContent, sourcePairFingerprint } from './source-refresh';`,
            `import { selectLatestTradeRepublicSourcesByContent } from './source-refresh';`,
          );

          replaceOnce(
            `\nconst LAST_SOURCE_FINGERPRINT_KEY = 'portfolio-dashboard-v5:last-source-fingerprint';\n`,
            `\n`,
          );

          replaceOnce(
            `function readLastSourceFingerprint(): string | null {\n  try {\n    return localStorage.getItem(LAST_SOURCE_FINGERPRINT_KEY);\n  } catch {\n    return null;\n  }\n}\n\nfunction writeLastSourceFingerprint(value: string): void {\n  try {\n    localStorage.setItem(LAST_SOURCE_FINGERPRINT_KEY, value);\n  } catch {\n    // Fingerprint persistence is only a convenience; analysis must not depend on it.\n  }\n}\n\n`,
            `function fastSourceHash(value: string): string {\n  let first = 0x811c9dc5;\n  let second = 0x9e3779b9;\n  for (let index = 0; index < value.length; index += 1) {\n    const code = value.charCodeAt(index);\n    first = Math.imul(first ^ code, 0x01000193);\n    second = Math.imul(second ^ code, 0x85ebca6b);\n  }\n  return [first, second]\n    .map((part) => (part >>> 0).toString(16).padStart(8, '0'))\n    .join('');\n}\n\nfunction parsedSourceFingerprint(csvText: string, snapshot: NetWorthSnapshot): string {\n  const pdfSemantics = JSON.stringify({\n    snapshotDate: snapshot.snapshotDate,\n    generatedAt: snapshot.generatedAt,\n    summary: snapshot.summary,\n    positions: snapshot.positions,\n  });\n  return ` + "`parsed-v1:${fastSourceHash(`${csvText}\\n${pdfSemantics}`)}`" + `;\n}\n\n`,
          );

          replaceOnce(
            `async function runAnalysis(\n  csvFile: File,\n  pdfFile: File,\n  fingerprint?: string,\n  preParsedSnapshot?: NetWorthSnapshot,\n): Promise<boolean> {`,
            `async function runAnalysis(\n  csvFile: File,\n  pdfFile: File,\n  preParsedSnapshot?: NetWorthSnapshot,\n  preReadCsvText?: string,\n): Promise<boolean> {`,
          );

          replaceOnce(
            `    const transactions = parseTransactions(await csvFile.text());\n    const ledger = normalizeLedger(transactions);\n    const audit = auditLedger(ledger);\n    const snapshot = preParsedSnapshot ?? await parseNetWorthPdf(pdfFile);`,
            `    const csvText = preReadCsvText ?? await csvFile.text();\n    const transactions = parseTransactions(csvText);\n    const ledger = normalizeLedger(transactions);\n    const audit = auditLedger(ledger);\n    const snapshot = preParsedSnapshot ?? await parseNetWorthPdf(pdfFile);\n    const fingerprint = parsedSourceFingerprint(csvText, snapshot);`,
          );

          replaceOnce(
            `    currentSourceFingerprint = fingerprint ?? null;`,
            `    currentSourceFingerprint = fingerprint;`,
          );

          replaceOnce(
            `    if (fingerprint) writeLastSourceFingerprint(fingerprint);\n`,
            ``,
          );

          replaceOnce(
            `    const inspectedPdfSnapshots = new Map<File, NetWorthSnapshot>();\n    const pair = await selectLatestTradeRepublicSourcesByContent(files, {`,
            `    const inspectedPdfSnapshots = new Map<File, NetWorthSnapshot>();\n    const inspectedCsvTexts = new Map<File, string>();\n    const pair = await selectLatestTradeRepublicSourcesByContent(files, {`,
          );

          replaceOnce(
            `      csvCoverage: async (file) => {\n        const transactions = parseTransactions(await file.text());`,
            `      csvCoverage: async (file) => {\n        const csvText = await file.text();\n        inspectedCsvTexts.set(file, csvText);\n        const transactions = parseTransactions(csvText);`,
          );

          replaceOnce(
            `    status.textContent = ` + "`Sources retenues : ${pair.pdf.name} (${pair.pdfSnapshotDate}) + ${pair.csv.name}${pair.csvLastDate ? ` (transactions jusqu’au ${pair.csvLastDate})` : ''}.`" + `;\n    const fingerprint = await sourcePairFingerprint(pair);\n    const unchanged = readLastSourceFingerprint() === fingerprint;\n    const alreadySaved = historySnapshots.some(\n      (snapshot) => snapshot.snapshotDate === pair.pdfSnapshotDate && snapshot.sourceFingerprint === fingerprint,\n    );\n\n    if (unchanged && currentAnalysis != null && alreadySaved) {\n      status.textContent = ` + "`Aucun nouvel export détecté : le snapshot ${pair.pdfSnapshotDate} est déjà analysé et enregistré.`" + `;\n      return;\n    }\n\n    const analyzed = await runAnalysis(pair.csv, pair.pdf, fingerprint, inspectedPdfSnapshots.get(pair.pdf));`,
            `    status.textContent = ` + "`Sources retenues : ${pair.pdf.name} (${pair.pdfSnapshotDate}) + ${pair.csv.name}${pair.csvLastDate ? ` (transactions jusqu’au ${pair.csvLastDate})` : ''}.`" + `;\n    const analyzed = await runAnalysis(\n      pair.csv,\n      pair.pdf,\n      inspectedPdfSnapshots.get(pair.pdf),\n      inspectedCsvTexts.get(pair.csv),\n    );`,
          );

          replaceOnce(
            `  try {\n    const fingerprint = await sourcePairFingerprint({ csv: csvFile, pdf: pdfFile });\n    await runAnalysis(csvFile, pdfFile, fingerprint);\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    status.textContent = ` + "`Échec de préparation des fichiers : ${message}`" + `;\n  }`,
            `  await runAnalysis(csvFile, pdfFile);`,
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Validate hotfix
        run: |
          npm ci
          npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git commit -m 'Avoid repeated iOS file reads for source fingerprinting'
          git push origin HEAD:hotfix/v5.2-ios-fingerprint-hang
