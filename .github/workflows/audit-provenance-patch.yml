name: Apply history provenance audit patch

on:
  push:
    branches: [v5.1/audit-provenance]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[provenance-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v5.1/audit-provenance
      - name: Patch save path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.ts')
          text = path.read_text()

          text = text.replace(
              "import { parseNetWorthPdf } from './net-worth';",
              "import { attachHistoryProvenance } from './history-provenance';\nimport { parseNetWorthPdf } from './net-worth';",
          )
          text = text.replace(
              "let currentMainFlows: CashFlow[] = [];",
              "let currentMainFlows: CashFlow[] = [];\nlet currentSourceFingerprint: string | null = null;",
          )
          text = text.replace(
              "    currentMainFlows = flows;\n    await refreshHistory();",
              "    currentMainFlows = flows;\n    currentSourceFingerprint = fingerprint ?? null;\n    await refreshHistory();",
          )
          text = text.replace(
              "    currentMainFlows = [];\n    setHistoryControls();",
              "    currentMainFlows = [];\n    currentSourceFingerprint = null;\n    setHistoryControls();",
          )
          text = text.replace(
              "    await saveHistorySnapshot(createHistorySnapshot(currentAnalysis, currentSnapshot));",
              "    const historyRecord = attachHistoryProvenance(\n      createHistorySnapshot(currentAnalysis, currentSnapshot),\n      currentSourceFingerprint,\n      currentAudit,\n    );\n    await saveHistorySnapshot(historyRecord);",
          )

          required = [
              "attachHistoryProvenance",
              "currentSourceFingerprint = fingerprint ?? null",
              "await saveHistorySnapshot(historyRecord)",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing expected patch marker: {marker}')

          path.write_text(text)
          Path('.github/workflows/audit-provenance-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[provenance-patched] Persist History v2 source provenance"
          git push
