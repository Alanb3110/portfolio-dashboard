name: Hotfix v5.2 iOS analysis hang

on:
  push:
    branches: [hotfix/v5.2-ios-analysis-hang]

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2-ios-analysis-hang
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted iOS analysis hotfix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`Expected source pattern not found in ${path}`);
            const updated = source.replace(from, to);
            if (updated === source) throw new Error(`No replacement made in ${path}`);
            fs.writeFileSync(path, updated);
          }

          replaceOnce(
            'src/net-worth.ts',
            `  const document = await getDocument({ data: bytes }).promise;\n  const pages: string[] = [];\n\n  for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {\n    const page = await document.getPage(pageNumber);\n    const content = await page.getTextContent();\n    const items: PositionedText[] = [];\n\n    for (const item of content.items) {\n      if (!('str' in item) || !('transform' in item)) continue;\n      const x = item.transform[4] ?? 0;\n      const y = item.transform[5] ?? 0;\n      items.push({ x, y, text: item.str });\n    }\n\n    const lines = new Map<number, PositionedText[]>();\n    for (const item of items) {\n      const y = Math.round(item.y * 2) / 2;\n      const line = lines.get(y) ?? [];\n      line.push(item);\n      lines.set(y, line);\n    }\n\n    const pageLines = [...lines.entries()]\n      .sort(([a], [b]) => b - a)\n      .map(([, line]) =>\n        line\n          .sort((a, b) => a.x - b.x)\n          .map((item) => item.text.trim())\n          .filter(Boolean)\n          .join(' '),\n      )\n      .filter(Boolean);\n\n    pages.push(pageLines.join('\\n'));\n  }\n\n  return pages.join('\\n');`,
            `  const loadingTask = getDocument({ data: bytes });\n  const document = await loadingTask.promise;\n  try {\n    const pages: string[] = [];\n\n    for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {\n      const page = await document.getPage(pageNumber);\n      const content = await page.getTextContent();\n      const items: PositionedText[] = [];\n\n      for (const item of content.items) {\n        if (!('str' in item) || !('transform' in item)) continue;\n        const x = item.transform[4] ?? 0;\n        const y = item.transform[5] ?? 0;\n        items.push({ x, y, text: item.str });\n      }\n\n      const lines = new Map<number, PositionedText[]>();\n      for (const item of items) {\n        const y = Math.round(item.y * 2) / 2;\n        const line = lines.get(y) ?? [];\n        line.push(item);\n        lines.set(y, line);\n      }\n\n      const pageLines = [...lines.entries()]\n        .sort(([a], [b]) => b - a)\n        .map(([, line]) =>\n          line\n            .sort((a, b) => a.x - b.x)\n            .map((item) => item.text.trim())\n            .filter(Boolean)\n            .join(' '),\n        )\n        .filter(Boolean);\n\n      pages.push(pageLines.join('\\n'));\n    }\n\n    return pages.join('\\n');\n  } finally {\n    await loadingTask.destroy();\n  }`,
          );

          replaceOnce(
            'src/main.ts',
            `async function runAnalysis(csvFile: File, pdfFile: File, fingerprint?: string): Promise<boolean> {`,
            `async function runAnalysis(\n  csvFile: File,\n  pdfFile: File,\n  fingerprint?: string,\n  preParsedSnapshot?: NetWorthSnapshot,\n): Promise<boolean> {`,
          );

          replaceOnce(
            'src/main.ts',
            `    const snapshot = await parseNetWorthPdf(pdfFile);`,
            `    const snapshot = preParsedSnapshot ?? await parseNetWorthPdf(pdfFile);`,
          );

          replaceOnce(
            'src/main.ts',
            `    publishUiSnapshot(snapshot);\n    await refreshHistory();\n    renderAnalysis(analysis, snapshot, audit, flows);`,
            `    publishUiSnapshot(snapshot);\n    // History is secondary to the local analysis. Use the in-memory history immediately\n    // instead of blocking result rendering on a redundant IndexedDB reload.\n    renderAnalysis(analysis, snapshot, audit, flows);`,
          );

          replaceOnce(
            'src/main.ts',
            `    status.textContent = 'Inspection des exports Trade Republic du dossier…';\n    const pair = await selectLatestTradeRepublicSourcesByContent(files, {\n      pdfSnapshotDate: async (file) => (await parseNetWorthPdf(file)).snapshotDate,`,
            `    status.textContent = 'Inspection des exports Trade Republic du dossier…';\n    const inspectedPdfSnapshots = new Map<File, NetWorthSnapshot>();\n    const pair = await selectLatestTradeRepublicSourcesByContent(files, {\n      pdfSnapshotDate: async (file) => {\n        const snapshot = await parseNetWorthPdf(file);\n        inspectedPdfSnapshots.set(file, snapshot);\n        return snapshot.snapshotDate;\n      },`,
          );

          replaceOnce(
            'src/main.ts',
            `    const analyzed = await runAnalysis(pair.csv, pair.pdf, fingerprint);`,
            `    const analyzed = await runAnalysis(pair.csv, pair.pdf, fingerprint, inspectedPdfSnapshots.get(pair.pdf));`,
          );

          replaceOnce(
            'src/main.ts',
            `void refreshHistory();`,
            `void refreshHistory().then(() => rerenderCurrentAnalysis());`,
          );
          NODE
      - name: Validate hotfix
        run: |
          npm ci
          npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/net-worth.ts
          git commit -m 'Fix iOS analysis hang after folder source selection'
          git push origin HEAD:hotfix/v5.2-ios-analysis-hang
