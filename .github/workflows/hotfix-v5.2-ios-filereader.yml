name: Hotfix v5.2 iOS FileReader

on:
  push:
    branches: [hotfix/v5.2-ios-filereader-strict-folder]

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2-ios-filereader-strict-folder
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch main UI flow
        run: python scripts/hotfix_ios_filreader.py
      - name: Validate hotfix
        run: |
          npm ci
          npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'Use FileReader for iOS CSV import and strict folder selection'
            git push origin HEAD:hotfix/v5.2-ios-filereader-strict-folder
          fi
