name: Hotfix v5.2 restore simple folder flow

on:
  push:
    branches: [hotfix/v5.2-restore-simple-folder-flow]

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2-restore-simple-folder-flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore one-pair folder flow
        run: python scripts/hotfix_restore_simple_folder_flow.py
      - name: Validate hotfix
        run: |
          npm ci
          npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git commit -m 'Restore simple one-pair iOS folder refresh'
          git push origin HEAD:hotfix/v5.2-restore-simple-folder-flow
