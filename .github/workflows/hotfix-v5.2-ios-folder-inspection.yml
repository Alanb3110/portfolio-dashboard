name: Hotfix v5.2 iOS folder inspection

on:
  push:
    branches: [hotfix/v5.2-ios-folder-inspection]

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2-ios-folder-inspection
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded folder inspection hotfix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          {
            const path = 'src/source-refresh.ts';
            let source = fs.readFileSync(path, 'utf8');
            const marker = `const ISO_DATE = /^\\d{4}-\\d{2}-\\d{2}$/;`;
            if (!source.includes(marker)) throw new Error('source-refresh marker missing');
            source = source.replace(marker, marker + '\nconst MAX_SEMANTIC_CANDIDATES = 3;');

            const beforePdfs = [
              '  const { csvFiles, pdfFiles } = matchingSources(files);',
              '  const warnings: string[] = [];',
              '',
              '  const inspectedPdfs: Array<{ file: File; snapshotDate: string }> = [];',
              '  for (const file of pdfFiles) {',
            ].join('\n');
            const afterPdfs = [
              '  const { csvFiles, pdfFiles } = matchingSources(files);',
              '  const warnings: string[] = [];',
              '  const pdfCandidates = [...pdfFiles].sort(compareFileMetadata).slice(0, MAX_SEMANTIC_CANDIDATES);',
              '  const csvCandidates = [...csvFiles].sort(compareFileMetadata).slice(0, MAX_SEMANTIC_CANDIDATES);',
              '  if (pdfFiles.length > pdfCandidates.length) {',
              "    warnings.push('Inspection PDF limitée aux ' + pdfCandidates.length + ' exports les plus récents sur ' + pdfFiles.length + '.');",
              '  }',
              '  if (csvFiles.length > csvCandidates.length) {',
              "    warnings.push('Inspection CSV limitée aux ' + csvCandidates.length + ' exports les plus récents sur ' + csvFiles.length + '.');",
              '  }',
              '',
              '  const inspectedPdfs: Array<{ file: File; snapshotDate: string }> = [];',
              '  for (const file of pdfCandidates) {',
            ].join('\n');
            if (!source.includes(beforePdfs)) throw new Error('PDF selection marker missing');
            source = source.replace(beforePdfs, afterPdfs);

            const beforeCsvs = [
              '  const inspectedCsvs: Array<{ file: File; coverage: CsvSemanticCoverage }> = [];',
              '  for (const file of csvFiles) {',
            ].join('\n');
            const afterCsvs = [
              '  const inspectedCsvs: Array<{ file: File; coverage: CsvSemanticCoverage }> = [];',
              '  for (const file of csvCandidates) {',
            ].join('\n');
            if (!source.includes(beforeCsvs)) throw new Error('CSV selection marker missing');
            source = source.replace(beforeCsvs, afterCsvs);
            fs.writeFileSync(path, source);
          }

          {
            const path = 'src/main.ts';
            let source = fs.readFileSync(path, 'utf8');
            const insertionPoint = 'function parsedSourceFingerprint(csvText: string, snapshot: NetWorthSnapshot): string {';
            if (!source.includes(insertionPoint)) throw new Error('main insertion marker missing');
            const timeoutHelper = [
              'const SOURCE_READ_TIMEOUT_MS = 15_000;',
              '',
              'async function withSourceTimeout<T>(operation: Promise<T>, label: string): Promise<T> {',
              '  let timer: ReturnType<typeof setTimeout> | undefined;',
              '  try {',
              '    return await Promise.race([',
              '      operation,',
              '      new Promise<T>((_, reject) => {',
              "        timer = setTimeout(() => reject(new Error('Délai dépassé pendant ' + label + '. Réessaie ou retire l’export concerné du dossier.')), SOURCE_READ_TIMEOUT_MS);",
              '      }),',
              '    ]);',
              '  } finally {',
              '    if (timer) clearTimeout(timer);',
              '  }',
              '}',
              '',
            ].join('\n');
            source = source.replace(insertionPoint, timeoutHelper + insertionPoint);

            const pdfBefore = [
              '      pdfSnapshotDate: async (file) => {',
              '        const snapshot = await parseNetWorthPdf(file);',
            ].join('\n');
            const pdfAfter = [
              '      pdfSnapshotDate: async (file) => {',
              "        status.textContent = 'Inspection du relevé ' + file.name + '…';",
              "        const snapshot = await withSourceTimeout(parseNetWorthPdf(file), 'la lecture de ' + file.name);",
            ].join('\n');
            if (!source.includes(pdfBefore)) throw new Error('main PDF marker missing');
            source = source.replace(pdfBefore, pdfAfter);

            const csvBefore = [
              '      csvCoverage: async (file) => {',
              '        const csvText = await file.text();',
            ].join('\n');
            const csvAfter = [
              '      csvCoverage: async (file) => {',
              "        status.textContent = 'Inspection des transactions ' + file.name + '…';",
              "        const csvText = await withSourceTimeout(file.text(), 'la lecture de ' + file.name);",
            ].join('\n');
            if (!source.includes(csvBefore)) throw new Error('main CSV marker missing');
            source = source.replace(csvBefore, csvAfter);
            fs.writeFileSync(path, source);
          }

          {
            const path = 'tests/source-refresh.test.ts';
            let source = fs.readFileSync(path, 'utf8');
            const anchor = `  it('reports matching but unreadable old exports without letting them win', async () => {`;
            const test = `  it('bounds semantic inspection to the three newest metadata candidates', async () => {\n    const pdfs = [\n      fakeFile('Net Worth.pdf', 100, 'p0'),\n      fakeFile('Net Worth (2).pdf', 200, 'p1'),\n      fakeFile('Net Worth (3).pdf', 300, 'p2'),\n      fakeFile('Net Worth (4).pdf', 400, 'p3'),\n      fakeFile('Net Worth (5).pdf', 500, 'p4'),\n    ];\n    const csvs = [\n      fakeFile('Transaction export.csv', 100, 'c0'),\n      fakeFile('Transaction export (2).csv', 200, 'c1'),\n      fakeFile('Transaction export (3).csv', 300, 'c2'),\n      fakeFile('Transaction export (4).csv', 400, 'c3'),\n      fakeFile('Transaction export (5).csv', 500, 'c4'),\n    ];\n    const seenPdfs: string[] = [];\n    const seenCsvs: string[] = [];\n    const selection = await selectLatestTradeRepublicSourcesByContent([...pdfs, ...csvs], {\n      pdfSnapshotDate: async (file) => { seenPdfs.push(file.name); return file.name.includes('(5)') ? '2026-09-05' : '2026-09-04'; },\n      csvCoverage: async (file) => { seenCsvs.push(file.name); return { lastDate: file.name.includes('(5)') ? '2026-09-04' : '2026-09-03', rows: 100 }; },\n    });\n    expect(seenPdfs).toHaveLength(3);\n    expect(seenCsvs).toHaveLength(3);\n    expect(seenPdfs).not.toContain('Net Worth.pdf');\n    expect(seenCsvs).not.toContain('Transaction export.csv');\n    expect(selection.pdf.name).toBe('Net Worth (5).pdf');\n    expect(selection.csv.name).toBe('Transaction export (5).csv');\n    expect(selection.warnings.some((warning) => warning.includes('limitée'))).toBe(true);\n  });\n\n`;
            if (!source.includes(anchor)) throw new Error('test anchor missing');
            source = source.replace(anchor, test + anchor);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Validate hotfix
        run: |
          npm ci
          npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/source-refresh.ts tests/source-refresh.test.ts
          git commit -m 'Bound iOS folder inspection and expose progress'
          git push origin HEAD:hotfix/v5.2-ios-folder-inspection
