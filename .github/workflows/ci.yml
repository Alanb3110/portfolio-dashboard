name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Commit generated lockfile on PR8
        if: github.event_name == 'pull_request' && github.head_ref == 'v5.1/pr8-reproducible-build'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Lock npm dependency graph'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Typecheck, test and build
        run: npm run check
      - name: Validate Cloudflare market proxy
        run: |
          node --check worker/src/index.js
          node worker/smoke-test.mjs
