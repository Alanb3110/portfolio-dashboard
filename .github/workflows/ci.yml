name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Typecheck, test and build
        run: npm run check
      - name: Built UI and depth validation smoke
        timeout-minutes: 2
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps jsdom@30.0.1 fake-indexeddb@6.2.5
          node scripts/ui-integration-smoke.mjs
          node scripts/depth-validation-smoke.mjs
      - name: Validate Cloudflare market proxy
        run: |
          node --check worker/src/index.js
          node worker/smoke-test.mjs
          node worker/check-config.mjs
          npx wrangler deploy --dry-run
