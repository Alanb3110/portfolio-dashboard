name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Typecheck, test and build
        run: npm run check
      - name: Validate Cloudflare market proxy
        run: |
          node --check worker/src/index.js
          node worker/smoke-test.mjs
