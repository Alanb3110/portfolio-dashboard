name: Apply root Wrangler pin

on:
  push:
    branches: [v5.1/audit-wrangler-pin]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wrangler-pinned]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v5.1/audit-wrangler-pin
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin Wrangler and update lockfile
        run: npm install --save-dev --save-exact wrangler@4.129.0 --ignore-scripts --legacy-peer-deps
      - name: Validate pinned deploy path
        run: |
          npm run check
          node worker/check-config.mjs
          npx wrangler deploy --dry-run
      - name: Commit generated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[wrangler-pinned] Pin root Wrangler deploy path"
          git push
